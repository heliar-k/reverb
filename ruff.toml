line-length = 88
target-version = "py39"
exclude = ["bazel-*", "third_party"]

[lint]
# E/W  = pycodestyle (flake8 defaults)
# F    = pyflakes (unused imports, undefined names)
# I    = isort (import ordering)
# B    = flake8-bugbear (common pitfalls)
# SIM  = flake8-simplify
# (UP/pyupgrade excluded: its PEP 604 annotations `X | None` require py3.10+, but this project targets py3.9 — see target-version above.)
select = ["E", "W", "F", "I", "B", "SIM"]
ignore = [
  "E501",   # line too long — formatter handles wrapping; lint flagging is noise
  "E731",   # lambda assignment — readable, common in this codebase
  "SIM112", # env var capitalization — build scripts read externally-defined names
  "B017",   # assertRaises(Exception) — tests intentionally assert any exception
  "B024",   # abstract base class without abstract methods — existing RateLimiter design
]

[lint.per-file-ignores]
# Test/example files may legitimately use unused imports or assertions.
"**/test_*.py" = ["F401", "F841"]
"examples/**/*.py" = ["B007", "F401", "E402"]
# .pyi stubs use forward-reference string annotations heavily; F821 (undefined
# name) fires on quoted types that are resolved at runtime, not real bugs.
"*.pyi" = ["F821"]
# String forward references (e.g. 'client.Client') trip F821 in modules with
# lazy/circular import patterns.
"reverb/server.py" = ["F821"]
# __init__.py re-exports public API symbols; F401 (unused import) is the whole
# point here.
"reverb/__init__.py" = ["F401"]

[format]
quote-style = "double"
indent-style = "space"
