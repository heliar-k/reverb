[build-system]
# 后端是仓库内的 _build_backend.py,只用 stdlib;bazel/patchelf 作为子进程调用。
# requires 留空:build 隔离环境里只需 stdlib(始终存在),bazel/patchelf 是系统工具。
requires = []
build-backend = "_build_backend"
backend-path = ["."]

[project]
name = "dm-reverb-numpy"
version = "0.15.0"
description = "Reverb is an efficient and easy-to-use data storage and transport system designed for machine learning research."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = 'DeepMind', email = 'no-reply@google.com' }]
requires-python = ">=3.9"
dependencies = [
  "absl-py",
  "dm-tree",
  "portpicker",
  "numpy",
  "packaging",
  # >=5.27: generated _pb2.py uses google.protobuf.runtime_version (5.27+);
  # older runtimes raise ImportError on import.
  "protobuf>=5.27",
]

[project.optional-dependencies]
# Optional torch.Tensor support (docs/design/torch-tensor-design.md). CPU 零拷贝;
# CUDA tensor 写入时一次 D2H。reverb 本体不依赖 torch。
torch = ["torch"]
classifiers = [
  'Development Status :: 3 - Alpha',
  'Intended Audience :: Developers',
  'Intended Audience :: Education',
  'Intended Audience :: Science/Research',
  'License :: OSI Approved :: Apache Software License',
  'Programming Language :: Python :: 3.9',
  'Programming Language :: Python :: 3.10',
  'Programming Language :: Python :: 3.11',
  'Programming Language :: Python :: 3.12',
  'Programming Language :: Python :: 3.13',
  'Topic :: Scientific/Engineering',
  'Topic :: Scientific/Engineering :: Mathematics',
  'Topic :: Scientific/Engineering :: Artificial Intelligence',
  'Topic :: Software Development',
  'Topic :: Software Development :: Libraries',
  'Topic :: Software Development :: Libraries :: Python Modules',
]
keywords = [
  'deepmind',
  'reinforcement',
  'machine',
  'learning',
  'replay',
  'jax',
  'numpy',
]

[project.urls]
homepage = "https://github.com/google-deepmind/reverb"

[project.scripts]
reverb_server = "reverb.server_executable.server_main:app_run_main"
